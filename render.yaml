# Render blueprint: backend (always-on) + frontend + managed Postgres.
# Deploy: push to GitHub, then "New > Blueprint" in Render and point it here.
services:
  - type: web
    name: jobtrack-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter            # always-on so the scheduler + Gmail poller keep running
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobtrack-db
          property: connectionString
      - key: PUBLIC_BASE_URL
        sync: false          # set to the deployed backend URL after first deploy
      - key: CORS_ORIGINS
        sync: false          # set to the deployed frontend URL
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false

  - type: web
    name: jobtrack-frontend
    runtime: node
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build
    startCommand: npm --prefix frontend run start
    plan: starter
    envVars:
      - key: NEXT_PUBLIC_API_BASE
        sync: false          # set to the deployed backend URL

databases:
  - name: jobtrack-db
    plan: free
